name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci
      - name: Check app
        run: |
          npm run typecheck
          npm test
          npm run check:build
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone test-signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk tools-please-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tools-please-android
          path: tools-please-android.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tools-please-android
      - name: Publish phone download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" tools-please-android.apk
          --title "Tools, Please $RELEASE_TAG"
          --notes "Android preview APK. Download on your phone and install. Uses test signing, not production store signing. Core calculations work offline."
          --prerelease